<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Temple Locator · Filter Camera · Pitch Detector</title>
    <!-- Google Fonts & Font Awesome for icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- HTML5 compatibility -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0f1e;
            font-family: 'Inter', sans-serif;
            color: #f0f3fa;
            padding: 16px 12px 80px 12px;
        }

        /* Main Container */
        .app-container {
            max-width: 550px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card style */
        .card {
            background: rgba(20, 27, 45, 0.85);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            padding: 18px 16px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 1.2rem;
            border-left: 4px solid #ffb347;
            padding-left: 12px;
        }

        /* Camera Section */
        .camera-wrapper {
            position: relative;
            border-radius: 1.5rem;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4 / 3;
            width: 100%;
            margin-bottom: 14px;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(1);
        }

        /* filters - applied via CSS filter property */
        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0 8px 0;
            justify-content: center;
        }

        .filter-btn {
            background: #1e2a3e;
            border: none;
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .filter-btn.active {
            background: #ffb347;
            color: #0a0f1e;
            box-shadow: 0 2px 12px rgba(255, 180, 71, 0.4);
        }

        /* button styles */
        .action-btn {
            background: linear-gradient(95deg, #2a3958, #1e2a44);
            border: none;
            padding: 12px 16px;
            border-radius: 3rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
        }

        .action-btn.primary {
            background: linear-gradient(95deg, #ff8c42, #ff6a1a);
            box-shadow: 0 6px 14px rgba(255, 108, 26, 0.25);
        }

        .action-btn i {
            font-size: 1.2rem;
        }

        .location-info, .temple-list {
            font-size: 0.9rem;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.2rem;
            padding: 12px;
        }

        .temple-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .temple-item i {
            width: 28px;
            color: #ffb347;
        }

        .pitch-meter {
            background: #111827;
            border-radius: 2rem;
            padding: 10px 16px;
            margin: 12px 0;
            text-align: center;
        }

        .pitch-value {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .note-name {
            font-size: 1rem;
            color: #bbb;
        }

        hr {
            border-color: #2d3748;
            margin: 8px 0;
        }

        /* responsive touch */
        @media (max-width: 500px) {
            body {
                padding: 12px 10px 70px 10px;
            }
            .filter-btn {
                padding: 6px 12px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Camera + Filters Card -->
    <div class="card">
        <div class="card-header">
            <i class="fas fa-camera-retro"></i> <span>Filter Lens</span>
        </div>
        <div class="camera-wrapper" id="cameraContainer">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="none"><i class="fas fa-filter-circle-xmark"></i> Normal</button>
            <button class="filter-btn" data-filter="grayscale"><i class="fas fa-adjust"></i> Mono</button>
            <button class="filter-btn" data-filter="sepia"><i class="fas fa-image"></i> Sepia</button>
            <button class="filter-btn" data-filter="vintage"><i class="fas fa-sun"></i> Vintage</button>
            <button class="filter-btn" data-filter="cool"><i class="fas fa-thermometer-half"></i> Cool</button>
            <button class="filter-btn" data-filter="warm"><i class="fas fa-fire"></i> Warm</button>
        </div>
        <p style="font-size: 0.7rem; text-align: center; margin-top: 6px;"><i class="fas fa-magic"></i> Real-time filters on camera preview</p>
    </div>

    <!-- Location & Near Temples Card -->
    <div class="card">
        <div class="card-header">
            <i class="fas fa-map-marker-alt"></i> <span>GPS · Temples nearby</span>
        </div>
        <button id="locationBtn" class="action-btn primary"><i class="fas fa-location-dot"></i> Show My Location & Temples</button>
        <div id="locationDisplay" class="location-info">
            <i class="fas fa-spinner fa-pulse"></i> Tap button to get location & temples
        </div>
        <div id="templeList" class="temple-list">
            <!-- dynamic temple list appears here -->
        </div>
    </div>

    <!-- Microphone Pitch Detector Card -->
    <div class="card">
        <div class="card-header">
            <i class="fas fa-microphone-alt"></i> <span>Pitch Monitor (mic)</span>
        </div>
        <button id="micBtn" class="action-btn"><i class="fas fa-microphone"></i> Start Mic & Check Pitch</button>
        <div class="pitch-meter" id="pitchMeter">
            <div class="pitch-value" id="pitchHz">— Hz</div>
            <div class="note-name" id="noteLabel">Tap to enable mic</div>
        </div>
        <p style="font-size: 0.7rem; text-align: center; margin-top: 6px;"><i class="fas fa-waveform"></i> Sing or hum — realtime pitch detection</p>
    </div>
</div>

<script>
    // ------------------------------
    // 1. CAMERA & FILTERS
    // ------------------------------
    const video = document.getElementById('video');
    let stream = null;
    let currentFilter = 'none';

    // Define filter classes mapping
    const filterMap = {
        none: '',
        grayscale: 'grayscale(100%)',
        sepia: 'sepia(80%)',
        vintage: 'sepia(40%) contrast(1.2) brightness(0.9)',
        cool: 'brightness(1.05) contrast(1.1) saturate(1.2) hue-rotate(10deg)',
        warm: 'brightness(1.02) contrast(1.05) saturate(1.3) sepia(0.2) hue-rotate(-10deg)'
    };

    function applyFilter(filterName) {
        currentFilter = filterName;
        const filterValue = filterMap[filterName] || '';
        video.style.filter = filterValue;
    }

    // Request camera access
    async function initCamera() {
        try {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            const constraints = { video: { facingMode: "user" }, audio: false };
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            await video.play();
            applyFilter(currentFilter);
        } catch (err) {
            console.warn("Camera error", err);
            alert("Camera permission required for filters. Allow access and refresh.");
        }
    }

    // Filter buttons event listeners
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filterVal = btn.getAttribute('data-filter');
            applyFilter(filterVal);
        });
    });

    // ------------------------------
    // 2. GPS + NEARBY TEMPLE (OpenStreetMap Nominatim / Overpass)
    // We'll fetch real temples using Overpass API (places of worship = temple)
    // Show user location, then get nearby temples within 2km radius
    // ------------------------------
    const locationBtn = document.getElementById('locationBtn');
    const locationDisplay = document.getElementById('locationDisplay');
    const templeListDiv = document.getElementById('templeList');

    function showLocationError(msg) {
        locationDisplay.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${msg}`;
        templeListDiv.innerHTML = `<i class="fas fa-map"></i> No temple data available`;
    }

    async function fetchNearbyTemples(lat, lon) {
        // Overpass query: find nodes/ways with amenity=place_of_worship and religion=hindu OR name contains temple
        // For better compatibility, we search for "temple" in name or religion=hindu + amenity=place_of_worship
        const radius = 2000; // 2 km
        const query = `
      [out:json];
      (
        node["amenity"="place_of_worship"]["religion"="hindu"](around:${radius},${lat},${lon});
        way["amenity"="place_of_worship"]["religion"="hindu"](around:${radius},${lat},${lon});
        node["amenity"="place_of_worship"]["name"~"temple",i](around:${radius},${lat},${lon});
        way["amenity"="place_of_worship"]["name"~"temple",i](around:${radius},${lat},${lon});
      );
      out body;
    `;
        const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            const elements = data.elements || [];
            // deduplicate by id
            const uniqueTemples = [];
            const seen = new Set();
            for (let el of elements) {
                if (!seen.has(el.id)) {
                    seen.add(el.id);
                    let name = el.tags?.name || "Unnamed Temple";
                    let distanceM = calculateDistance(lat, lon, el.lat, el.lon);
                    uniqueTemples.push({ name, lat: el.lat, lon: el.lon, distance: Math.round(distanceM) });
                }
            }
            // sort by distance
            uniqueTemples.sort((a,b) => a.distance - b.distance);
            return uniqueTemples.slice(0, 8); // show up to 8
        } catch (err) {
            console.error("Overpass fetch error", err);
            return [];
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // meters
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function renderTemples(temples, userLat, userLon) {
        if (!temples.length) {
            templeListDiv.innerHTML = `<i class="fas fa-temple"></i> No temples found within 2km radius. Try moving or check city area.`;
            return;
        }
        let html = `<div style="margin-bottom: 8px;"><i class="fas fa-place-of-worship"></i> <strong>Nearby Temples (${temples.length} found)</strong></div>`;
        temples.forEach(t => {
            html += `
          <div class="temple-item">
            <i class="fas fa-temple"></i>
            <div><strong>${escapeHtml(t.name)}</strong><br><span style="font-size:0.75rem;">📍 ${t.distance} meters away</span></div>
          </div>
        `;
        });
        templeListDiv.innerHTML = html;
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    async function getLocationAndTemples() {
        if (!navigator.geolocation) {
            showLocationError("Geolocation not supported by browser");
            return;
        }
        locationDisplay.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Fetching location ...`;
        templeListDiv.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Searching temples nearby...`;
        navigator.geolocation.getCurrentPosition(async (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            locationDisplay.innerHTML = `<i class="fas fa-map-pin"></i> <strong>Your location</strong><br>Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}<br><span style="font-size:0.7rem;">Accuracy: ±${Math.round(accuracy)}m</span>`;

            // fetch temples using overpass
            const temples = await fetchNearbyTemples(lat, lon);
            renderTemples(temples, lat, lon);
        }, (error) => {
            let errMsg = "Location error: ";
            switch(error.code) {
                case error.PERMISSION_DENIED: errMsg += "Permission denied. Allow GPS access."; break;
                case error.POSITION_UNAVAILABLE: errMsg += "Position unavailable."; break;
                case error.TIMEOUT: errMsg += "Request timeout."; break;
                default: errMsg += "Unknown error.";
            }
            showLocationError(errMsg);
            templeListDiv.innerHTML = `<i class="fas fa-ban"></i> Could not fetch temples without location.`;
        }, { enableHighAccuracy: true, timeout: 10000 });
    }

    locationBtn.addEventListener('click', getLocationAndTemples);

    // ------------------------------
    // 3. MICROPHONE PITCH DETECTION
    // using Web Audio API + autocorrelation (pitch detection)
    // ------------------------------
    let audioContext = null;
    let mediaStream = null;
    let sourceNode = null;
    let analyserNode = null;
    let animationId = null;
    let isMicActive = false;
    const micBtn = document.getElementById('micBtn');
    const pitchHzSpan = document.getElementById('pitchHz');
    const noteLabelSpan = document.getElementById('noteLabel');

    // Helper: frequency to note name
    function getNoteName(freq) {
        if (freq <= 0) return " — ";
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const A4 = 440;
        const C0 = A4 * Math.pow(2, -4.75);
        let halfStepsFromC0 = 12 * Math.log2(freq / C0);
        let halfStepsRounded = Math.round(halfStepsFromC0);
        let octave = Math.floor(halfStepsRounded / 12);
        let noteIndex = halfStepsRounded % 12;
        if (noteIndex < 0) noteIndex += 12;
        return `${noteNames[noteIndex]}${octave}`;
    }

    // pitch detection via autocorrelation (simple but decent for realtime)
    function getPitch(buffer, sampleRate) {
        let size = buffer.length;
        let sumOfSquares = 0;
        for (let i = 0; i < size; i++) sumOfSquares += buffer[i] * buffer[i];
        if (sumOfSquares === 0) return -1;
        let rms = Math.sqrt(sumOfSquares / size);
        if (rms < 0.01) return -1;  // too silent

        let minSamples = Math.floor(sampleRate / 800); // max freq 800Hz approx for voice? but can go higher
        let maxSamples = Math.floor(sampleRate / 70);   // min freq ~70Hz
        let bestOffset = -1;
        let bestCorrelation = 0;
        for (let offset = minSamples; offset <= maxSamples; offset++) {
            let correlation = 0;
            for (let i = 0; i < maxSamples && (i+offset) < size; i++) {
                correlation += buffer[i] * buffer[i+offset];
            }
            let norm = 0;
            for (let i = 0; i < maxSamples && i < size; i++) norm += buffer[i] * buffer[i];
            if (norm > 0) {
                correlation = correlation / norm;
            }
            if (correlation > bestCorrelation) {
                bestCorrelation = correlation;
                bestOffset = offset;
            }
        }
        if (bestCorrelation > 0.4 && bestOffset > 0) {
            let pitch = sampleRate / bestOffset;
            if (pitch > 50 && pitch < 1000) return pitch;
        }
        return -1;
    }

    async function startPitchDetection() {
        if (isMicActive) {
            // if already active, stop
            stopPitchDetection();
            micBtn.innerHTML = '<i class="fas fa-microphone"></i> Start Mic & Check Pitch';
            return;
        }
        try {
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = micStream;
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (sourceNode) {
                try { sourceNode.disconnect(); } catch(e) {}
            }
            sourceNode = audioContext.createMediaStreamSource(micStream);
            analyserNode = audioContext.createAnalyser();
            analyserNode.fftSize = 2048;
            const bufferLength = analyserNode.frequencyBinCount;
            sourceNode.connect(analyserNode);
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            isMicActive = true;
            micBtn.innerHTML = '<i class="fas fa-stop-circle"></i> Stop Mic & Pitch';
            pitchHzSpan.innerText = '⚡ Listening...';
            noteLabelSpan.innerText = 'Hum or sing anything';
            function updatePitchLoop() {
                if (!isMicActive || !analyserNode) return;
                const dataArray = new Float32Array(analyserNode.fftSize);
                analyserNode.getFloatTimeDomainData(dataArray);
                const pitch = getPitch(dataArray, audioContext.sampleRate);
                if (pitch > 0) {
                    const rounded = Math.round(pitch);
                    pitchHzSpan.innerText = `${rounded} Hz`;
                    const note = getNoteName(pitch);
                    noteLabelSpan.innerText = `🎵 ${note}`;
                } else {
                    pitchHzSpan.innerText = '— Hz';
                    noteLabelSpan.innerText = '🔇 low signal / no pitch';
                }
                animationId = requestAnimationFrame(updatePitchLoop);
            }
            if (animationId) cancelAnimationFrame(animationId);
            updatePitchLoop(
