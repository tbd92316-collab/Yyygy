name: Automated HTML to APK Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Pre-Generate Local Android Debug Keystore
      run: |
        mkdir -p github_keystore
        keytool -genkey -v -keystore github_keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup Android Project Files
      run: |
        mkdir -p android/app/src/main/java/com/compiler/htmltoapk
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/assets

        # 1. gradle.properties Setup
        cat << 'EOF' > android/gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 2. AndroidManifest.xml (Removed Background Services and Foreground Permissions)
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            
            <application 
                android:allowBackup="true" 
                android:label="Fast Chat Pro" 
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                
                <activity android:name="com.compiler.htmltoapk.MainActivity" 
                    android:configChanges="orientation|screenSize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 3. Activity Layout XML
        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <android.webkit.WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview" 
            android:layout_width="match_parent" 
            android:layout_height="match_parent" />
        EOF

        # 4. MainActivity.java (Zero Background Core - Completely Battery Friendly)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/MainActivity.java
        package com.compiler.htmltoapk;
        
        import android.app.Activity;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.net.Uri;
        import android.os.Bundle;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.JavascriptInterface;

        public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> uploadMessage;
            private final static int FILECHOOSER_RESULTCODE = 1;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                webView = (WebView) findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                
                webView.setWebViewClient(new WebViewClient());
                
                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                        if (uploadMessage != null) { uploadMessage.onReceiveValue(null); }
                        uploadMessage = filePathCallback;
                        Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("image/*");
                        startActivityForResult(Intent.createChooser(intent, "Select Image from Gallery"), FILECHOOSER_RESULTCODE);
                        return true;
                    }
                });

                webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILECHOOSER_RESULTCODE) {
                    if (uploadMessage == null) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        String dataString = data.getDataString();
                        if (dataString != null) { results = new Uri[]{Uri.parse(dataString)}; }
                    }
                    uploadMessage.onReceiveValue(results);
                    uploadMessage = null;
                }
            }

            public class WebAppInterface {
                Context mContext;
                WebAppInterface(Context c) { mContext = c; }

                @JavascriptInterface
                public void updateUserSession(String uid, String name) {
                    SharedPreferences prefs = mContext.getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                    prefs.edit().putString("user_uid", uid).putString("user_name", name).apply();
                    // Background Service triggers removed completely to preserve UX and battery life
                }

                @JavascriptInterface
                public void updateActiveChatPartner(String partnerUid) {
                    // Handled inside web UI locally
                }
            }
        }
        EOF

        # 5. Root build.gradle Setup
        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 6. Settings.gradle Setup
        cat << 'EOF' > android/settings.gradle
        include ':app'
        EOF

        # 7. App-level build.gradle Setup
        cat << 'EOF' > android/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace "com.compiler.htmltoapk"
            compileSdk 34
            defaultConfig {
                applicationId "com.compiler.htmltoapk"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "3.0"
                ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
            }
            signingConfigs {
                debug {
                    storeFile file("../../github_keystore/debug.keystore")
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
            buildTypes {
                debug {
                    signingConfig signingConfigs.debug
                }
            }
        }
        dependencies { implementation 'androidx.core:core:1.12.0' }
        EOF

    - name: Inject Custom Assets and Logo Resources
      run: |
        if [ -f "logo.png" ]; then
          cp logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        else
          cp android/app/src/main/java/com/compiler/htmltoapk/MainActivity.java android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        fi

        if [ -f "index.html" ]; then
          cp index.html android/app/src/main/assets/index.html
        else
          echo "<h1>Fast Chat Setup Error</h1>" > android/app/src/main/assets/index.html
        fi

    - name: Build Android Project wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    - name: Compile and Generate APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fast-Chat-Ultimate-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
