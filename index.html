<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Auto Redirect -->
  <meta http-equiv="refresh" content="4; url=https://www.youtube.com">

  <title>YouTube Mobile Loading</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0f0f0f;
      font-family:Arial,sans-serif;
      overflow:hidden;
    }

    /* Skeleton Effect */
    .skeleton{
      position:relative;
      overflow:hidden;
      background:#242424;
      border-radius:12px;
    }

    .skeleton::before{
      content:"";
      position:absolute;
      top:0;
      left:-150px;
      width:150px;
      height:100%;
      background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.12),
        transparent
      );
      animation:shine 1.2s infinite;
    }

    @keyframes shine{
      100%{
        left:100%;
      }
    }

    /* Header */
    .header{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      border-bottom:1px solid #1f1f1f;
    }

    .yt-logo{
      width:95px;
      height:22px;
    }

    .header-icons{
      display:flex;
      gap:12px;
    }

    .icon{
      width:26px;
      height:26px;
      border-radius:50%;
    }

    /* Category Chips */
    .chips{
      display:flex;
      gap:10px;
      padding:12px;
      overflow:hidden;
    }

    .chip{
      min-width:70px;
      height:32px;
      border-radius:30px;
    }

    /* Feed */
    .feed{
      display:flex;
      flex-direction:column;
      gap:24px;
      padding-bottom:80px;
    }

    /* Video Card */
    .video{
      width:100%;
    }

    .thumb{
      width:100%;
      height:220px;
      border-radius:0;
    }

    .video-info{
      display:flex;
      gap:12px;
      padding:12px;
    }

    .channel{
      width:38px;
      height:38px;
      border-radius:50%;
      flex-shrink:0;
    }

    .text{
      flex:1;
    }

    .line1{
      width:95%;
      height:15px;
      margin-bottom:10px;
    }

    .line2{
      width:60%;
      height:13px;
    }

    /* Bottom Nav */
    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      width:100%;
      height:60px;
      background:#0f0f0f;
      border-top:1px solid #1f1f1f;
      display:flex;
      justify-content:space-around;
      align-items:center;
      padding:0 10px;
    }

    .nav-icon{
      width:24px;
      height:24px;
      border-radius:8px;
    }

  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="yt-logo skeleton"></div>

    <div class="header-icons">
      <div class="icon skeleton"></div>
      <div class="icon skeleton"></div>
      <div class="icon skeleton"></div>
    </div>
  </div>

  <!-- Chips -->
  <div class="chips">
    <div class="chip skeleton"></div>
    <div class="chip skeleton"></div>
    <div class="chip skeleton"></div>
    <div class="chip skeleton"></div>
  </div>

  <!-- Feed -->
  <div class="feed">

    <!-- Video 1 -->
    <div class="video">
      <div class="thumb skeleton"></div>

      <div class="video-info">
        <div class="channel skeleton"></div>

        <div class="text">
          <div class="line1 skeleton"></div>
          <div class="line2 skeleton"></div>
        </div>
      </div>
    </div>

    <!-- Video 2 -->
    <div class="video">
      <div class="thumb skeleton"></div>

      <div class="video-info">
        <div class="channel skeleton"></div>

        <div class="text">
          <div class="line1 skeleton"></div>
          <div class="line2 skeleton"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-icon skeleton"></div>
    <div class="nav-icon skeleton"></div>
    <div class="nav-icon skeleton"></div>
    <div class="nav-icon skeleton"></div>
  </div>

</body>
</html>
