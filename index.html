<!DOCTYPE html>

<head>

            display: flex;
            flex-direction: column;

        }
        .card {

            color: white;
            border: none;
            padding: 10px 20px;

            font-weight: bold;
            margin-top: 15px;
        }

</head>
<body>
    <div class="card">
        <h1>System Live! ✅</h1>
