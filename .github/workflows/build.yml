name: Automated HTML to APK Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Files
      run: |
        mkdir -p android/app/src/main/java/com/compiler/htmltoapk
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/assets

        # 1. gradle.properties
        cat << 'EOF' > android/gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 2. AndroidManifest.xml
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
            
            <application 
                android:allowBackup="true" 
                android:label="Fast Chat Ultimate" 
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                
                <activity android:name="com.compiler.htmltoapk.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service 
                    android:name="com.compiler.htmltoapk.ChatSyncService"
                    android:foregroundServiceType="dataSync"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

        # 3. Activity Layout XML
        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <android.webkit.WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview" 
            android:layout_width="match_parent" 
            android:layout_height="match_parent" />
        EOF

        # 4. MainActivity.java
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/MainActivity.java
        package com.compiler.htmltoapk;
        
        import android.Manifest;
        import android.app.Activity;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.os.Build;
        import android.os.Bundle;
        import android.webkit.JavascriptInterface;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.core.app.ActivityCompat;

        public class MainActivity extends Activity {
            private WebView webView;
            public static boolean isAppOpen = false;
            public static String activeChatPartnerUid = "";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                webView = (WebView) findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                
                webView.setWebViewClient(new WebViewClient());
                webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                }
                
                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onResume() {
                super.onResume();
                isAppOpen = true;
            }

            @Override
            protected void onPause() {
                super.onPause();
                isAppOpen = false;
            }

            @Override
            protected void onDestroy() {
                super.onDestroy();
                isAppOpen = false;
            }

            public class WebAppInterface {
                Context mContext;
                WebAppInterface(Context c) { mContext = c; }

                @JavascriptInterface
                public void updateUserSession(String uid, String name) {
                    SharedPreferences prefs = mContext.getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                    prefs.edit().putString("user_uid", uid).putString("user_name", name).apply();
                    
                    Intent serviceIntent = new Intent(mContext, ChatSyncService.class);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        mContext.startForegroundService(serviceIntent);
                    } else {
                        mContext.startService(serviceIntent);
                    }
                }

                @JavascriptInterface
                public void updateActiveChatPartner(String partnerUid) {
                    MainActivity.activeChatPartnerUid = partnerUid;
                }
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

        # 5. ChatSyncService.java (BUG FIX: Unique Message ID tracking algorithm implemented)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/ChatSyncService.java
        package com.compiler.htmltoapk;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.Service;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import org.json.JSONObject;
        import java.util.Iterator;
        import java.util.HashSet;

        public class ChatSyncService extends Service {
            private static final String CHANNEL_ID = "fast_chat_service_channel";
            private static final String ALERT_CHANNEL_ID = "fast_chat_secure";
            private boolean isRunning = false;
            // HashSet to prevent previous message repetition bugs globally
            private HashSet<String> notifiedMessageIds = new HashSet<>();

            @Override
            public void onCreate() {
                super.onCreate();
                createNotificationChannels();
                
                Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                        .setContentTitle("Fast Chat Pro Core")
                        .setContentText("Background server active...")
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setPriority(NotificationCompat.PRIORITY_MIN)
                        .build();
                        
                startForeground(1, notification);
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                if (!isRunning) {
                    isRunning = true;
                    startPollingThread();
                }
                return START_STICKY;
            }

            private void startPollingThread() {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        boolean isFirstLoad = true;
                        while (isRunning) {
                            try {
                                SharedPreferences prefs = getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                                String myUid = prefs.getString("user_uid", "");

                                if (!myUid.isEmpty()) {
                                    URL url = new URL("https://movi-hub-default-rtdb.firebaseio.com/secure_chats.json");
                                    HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                    conn.setRequestMethod("GET");
                                    
                                    BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                    StringBuilder response = new StringBuilder();
                                    String inputLine;
                                    while ((inputLine = in.readLine()) != null) {
                                        response.append(inputLine);
                                    }
                                    in.close();

                                    if (response.toString().equals("null")) {
                                        Thread.sleep(4000);
                                        continue;
                                    }

                                    JSONObject allRooms = new JSONObject(response.toString());
                                    Iterator<String> keys = allRooms.keys();
                                    
                                    while (keys.hasNext()) {
                                        String roomId = keys.next();
                                        if (roomId.contains(myUid)) {
                                            JSONObject roomMessages = allRooms.getJSONObject(roomId);
                                            Iterator<String> msgKeys = roomMessages.keys();
                                            
                                            while(msgKeys.hasNext()) {
                                                String msgId = msgKeys.next();
                                                
                                                // Check if this explicit Message ID was already handled previously
                                                if (!notifiedMessageIds.contains(msgId)) {
                                                    JSONObject messageData = roomMessages.getJSONObject(msgId);
                                                    String senderUid = messageData.getString("senderUid");
                                                    String receiverUid = messageData.getString("receiverUid");
                                                    String senderName = messageData.getString("senderName");
                                                    String text = messageData.optString("text", "");
                                                    String mediaUrl = messageData.optString("mediaUrl", "");

                                                    // Track it immediately to block future iterations
                                                    notifiedMessageIds.add(msgId);

                                                    // Avoid throwing history popups upon fresh app boot initialization
                                                    if (!isFirstLoad && !senderUid.equals(myUid) && receiverUid.equals(myUid)) {
                                                        if (!MainActivity.isAppOpen || !MainActivity.activeChatPartnerUid.equals(senderUid)) {
                                                            triggerPopupAlert(senderName, mediaUrl.isEmpty() ? text : "🖼️ Image Attachment");
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                    isFirstLoad = false; // Grace period ends after processing pre-existing tree entries
                                }
                                Thread.sleep(3500); 
                            } catch (Exception e) {
                                e.printStackTrace();
                                try { Thread.sleep(5000); } catch (Exception ignored) {}
                            }
                        }
                    }
                }).start();
            }

            private void triggerPopupAlert(String title, String body) {
                NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                NotificationCompat.Builder builder = new NotificationCompat.Builder(this, ALERT_CHANNEL_ID)
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setContentTitle(title)
                        .setContentText(body)
                        .setPriority(NotificationCompat.PRIORITY_HIGH)
                        .setDefaults(NotificationCompat.DEFAULT_ALL)
                        .setAutoCancel(true);
                if (manager != null) {
                    manager.notify((int) System.currentTimeMillis(), builder.build());
                }
            }

            private void createNotificationChannels() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel serviceChannel = new NotificationChannel(CHANNEL_ID, "Sync Monitoring", NotificationManager.IMPORTANCE_MIN);
                    NotificationChannel alertChannel = new NotificationChannel(ALERT_CHANNEL_ID, "Secure Chat Alerts", NotificationManager.IMPORTANCE_HIGH);
                    NotificationManager manager = getSystemService(NotificationManager.class);
                    if (manager != null) {
                        manager.createNotificationChannel(serviceChannel);
                        manager.createNotificationChannel(alertChannel);
                    }
                }
            }

            @Override
            public IBinder onBind(Intent intent) { return null; }

            @Override
            public void onDestroy() {
                isRunning = false;
                super.onDestroy();
            }
        }
        EOF

        # 6. Root build.gradle Setup
        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 7. Settings.gradle Setup
        cat << 'EOF' > android/settings.gradle
        include ':app'
        EOF

        # 8. App-level build.gradle Setup
        cat << 'EOF' > android/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.compiler.htmltoapk'
            compileSdk 34
            defaultConfig {
                applicationId "com.compiler.htmltoapk"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
                ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
            }
        }
        dependencies { implementation 'androidx.core:core:1.12.0' }
        EOF

    - name: Inject Custom App Logo
      run: |
        if [ -f "logo.png" ]; then
          cp logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        else
          touch android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        fi

    - name: Inject HTML into App Assets
      run: |
        if [ -f "index.html" ]; then
          cp index.html android/app/src/main/assets/index.html
        else
          echo "<h1>Error</h1>" > android/app/src/main/assets/index.html
        fi

    - name: Build Android Project wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    - name: Compile and Generate APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fast-Chat-Ultimate-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
