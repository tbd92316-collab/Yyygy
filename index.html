<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Chat Pro & WebRTC Video</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #11141a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        
        /* Main Chat Layout */
        #app-container { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        header { background: #1f2430; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3446; }
        .user-info { display: flex; flex-direction: column; }
        .call-btn { background: #2ecc71; border: none; padding: 8px 15px; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
        
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #161a23; }
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; position: relative; line-height: 1.4; word-wrap: break-word; }
        .msg.sent { background: #0084ff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.received { background: #2d3446; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* Ticks UI elements */
        .meta-container { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 4px; }
        .tick { font-weight: bold; font-size: 12px; }
        .tick.blue { color: #00e676; } /* Single/Double Tick color logic */

        #input-area { background: #1f2430; padding: 10px; display: flex; gap: 10px; align-items: center; }
        #input-area input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #2d3446; color: white; outline: none; }
        #input-area button { background: #0084ff; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; font-weight: bold; cursor: pointer; }

        /* ==================== WebRTC VIDEO CALL FULLSCREEN OVERLAY ==================== */
        #video-call-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; display: none; flex-direction: column; z-index: 9999;
        }
        .video-container { flex: 1; position: relative; width: 100%; height: 100%; }
        /* Remote View Fullscreen */
        #remote-video { width: 100%; height: 100%; object-fit: cover; background: #222; }
        /* Local View Thumbnail Float */
        #local-video {
            position: absolute; top: 20px; right: 20px; width: 120px; height: 160px;
            object-fit: cover; border-radius: 8px; border: 2px solid white; background: #333; z-index: 10;
        }
        .call-controls {
            position: absolute; bottom: 40px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 30px; z-index: 20;
        }
        .end-call-btn {
            background: #e74c3c; border: none; width: 60px; height: 60px;
            border-radius: 50%; color: white; font-weight: bold; font-size: 20px; cursor: pointer;
        }
        .call-status-banner {
            position: absolute; top: 40px; left: 0; width: 100%; text-align: center;
            font-size: 18px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 20;
        }

        /* In-App Call Alert Modal Dialogue */
        #inapp-call-popup {
            position: fixed; top: 20px; left: 5%; width: 90%; background: #1e272e;
            border-radius: 12px; padding: 15px; display: none; align-items: center;
            justify-content: space-between; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #2ecc71; z-index: 10000; animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
        .popup-actions { display: flex; gap: 10px; }
        .btn-action { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; }
        .btn-action.ans { background: #2ecc71; }
        .btn-action.dec { background: #e74c3c; }
    </style>
</head>
<body>

    <div id="app-container">
        <header>
            <div class="user-info">
                <h3 id="partner-title">Loading Active Partner...</h3>
                <small id="connection-status">Realtime Sync Active</small>
            </div>
            <button class="call-btn" onclick="startOutboundVideoCall()">📞 Video Call</button>
        </header>

        <div id="chat-box"></div>

        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Type a secure message...">
            <button onclick="triggerTextMessageSend()">➔</button>
        </div>
    </div>

    <div id="video-call-overlay">
        <div class="call-status-banner" id="call-status-text">Connecting WebRTC Streams...</div>
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button class="end-call-btn" onclick="hangupCurrentCall()">Hangup</button>
        </div>
    </div>

    <div id="inapp-call-popup">
        <div>
            <h4 id="popup-caller-name">Incoming Video Call</h4>
            <p style="font-size: 12px; color: #aaa;">Fast Chat Realtime Request</p>
        </div>
        <div class="popup-actions">
            <button class="btn-action ans" id="popup-ans-btn">Answer</button>
            <button class="btn-action dec" id="popup-dec-btn">Decline</button>
        </div>
    </div>

    <audio id="ringtone-player" loop src="https://assets.mixkit.co/active_storage/sfx/1359/1359-84.wav" preload="auto"></audio>

    <script>
        // 1. Firebase Core Initialization Configurations
        const firebaseConfig = {
            apiKey: "AIzaSyAOsGkBI2QDkZAuogCEWsX2Eu3Q2jJYeCE",
            authDomain: "movi-hub.firebaseapp.com",
            databaseURL: "https://movi-hub-default-rtdb.firebaseio.com",
            projectId: "movi-hub",
            storageBucket: "movi-hub.firebasestorage.app",
            messagingSenderId: "15875013349",
            appId: "1:15875013349:web:ab65915c3bd575772ab20c"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Session Mock Configuration Variables
        let myUid = "USER_A_UID";     // Dynamic: Android Bridge sets actual user session inside app setup
        let myName = "Akash Developer";
        let partnerUid = "USER_B_UID"; // Opponent session key mapping targeted data paths
        let currentRoomId = "";

        // WebRTC Global Engines Configurations
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        const rtcIceServers = { iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun2.l.google.com:19302"] }] };

        // Fetch Android Device Bridge metadata sessions hooks
        if (typeof localStorage !== "undefined") {
            if (localStorage.getItem("myUid")) myUid = localStorage.getItem("myUid");
            if (localStorage.getItem("partnerUid")) partnerUid = localStorage.getItem("partnerUid");
        }

        // Bridge setup fallback update endpoints
        document.getElementById('partner-title').innerText = "Chat with " + partnerUid;
        if(window.AndroidBridge) {
            window.AndroidBridge.updateUserSession(myUid, myName);
            window.AndroidBridge.updateActiveChatPartner(partnerUid);
        }

        // ==================== 💬 MESSAGING CHAT & LOGIC (SINGLE / DOUBLE TICK) ====================
        
        function triggerTextMessageSend() {
            const inputField = document.getElementById("msg-input");
            const rawMessageText = inputField.value.trim();
            if (!rawMessageText) return;

            const messageNodePayload = {
                senderUid: myUid,
                receiverUid: partnerUid,
                senderName: myName,
                text: rawMessageText,
                timestamp: new Date().getTime(),
                status: "sent" // Always 'sent' (Single Tick) initially on dispatch pipeline
            };

            database.ref('secure_chats').push(messageNodePayload);
            inputField.value = "";
        }

        // Realtime Data Pipeline Listener
        database.ref('secure_chats').on('child_added', (snapshot) => {
            const msg = snapshot.val();
            const msgKey = snapshot.key;

            // Handle Ticket System Transformations
            if (msg.receiverUid === myUid && msg.status === "sent") {
                // If user is actively reading this conversation chat box frame, switch immediately to read state
                database.ref('secure_chats/' + msgKey).update({ status: "read" });
            } else if (msg.receiverUid === myUid && msg.status === "delivered") {
                database.ref('secure_chats/' + msgKey).update({ status: "read" });
            }

            renderMessageToUi(msg);
        });

        // Watch modifications for status tracking transformations updates
        database.ref('secure_chats').on('child_changed', (snapshot) => {
            const updatedMsg = snapshot.val();
            const msgDomElement = document.getElementById("msg-" + updatedMsg.timestamp);
            if (msgDomElement) {
                const tickContainer = msgDomElement.querySelector(".tick");
                if (tickContainer) {
                    if (updatedMsg.status === "delivered") {
                        tickContainer.innerText = "✓✓";
                        tickContainer.className = "tick";
                    } else if (updatedMsg.status === "read") {
                        tickContainer.innerText = "✓✓";
                        tickContainer.className = "tick blue";
                    }
                }
            }
        });

        function renderMessageToUi(msg) {
            const chatBox = document.getElementById("chat-box");
            const isMe = msg.senderUid === myUid;
            
            // Filter target streams mappings checks logic
            if ((msg.senderUid === myUid && msg.receiverUid === partnerUid) || (msg.senderUid === partnerUid && msg.receiverUid === myUid)) {
                let tickIconHtml = "";
                if (isMe) {
                    let tickDesign = "✓";
                    let classConfig = "tick";
                    if (msg.status === "delivered") { tickDesign = "✓✓"; }
                    if (msg.status === "read") { tickDesign = "✓✓"; classConfig = "tick blue"; }
                    tickIconHtml = `<span class="${classConfig}">${tickDesign}</span>`;
                }

                const bubbleLayout = `
                    <div class="msg ${isMe ? 'sent' : 'received'}" id="msg-${msg.timestamp}">
                        <div>${msg.text}</div>
                        <div class="meta-container">
                            ${tickIconHtml}
                        </div>
                    </div>
                `;
                chatBox.innerHTML += bubbleLayout;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }


        // ==================== 🎥 WebRTC OUTBOUND VIDEO CALL PIPELINE (CALLER) ====================

        async function startOutboundVideoCall() {
            currentRoomId = myUid + "_" + partnerUid + "_" + Math.floor(Math.random() * 100000);
            document.getElementById("call-status-text").innerText = "Ringing Opponent...";
            document.getElementById("video-call-overlay").style.display = "flex";

            // Initialize Local Hardware Camera Capture Streams Engine
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("local-video").srcObject = localStream;

            // Push Signal Frame Structure Setup to Database
            const callSignalData = {
                callType: "video",
                receiverUid: partnerUid,
                callerName: myName,
                roomId: currentRoomId,
                callStatus: "pending",
                timestamp: new Date().getTime().toString()
            };

            database.ref('secure_chats_calls/' + currentRoomId).set(callSignalData);
            
            // Listen for acceptance response changes loops on signal frame nodes
            database.ref('secure_chats_calls/' + currentRoomId).on('value', (snapshot) => {
                const callInfo = snapshot.val();
                if (!callInfo) return;

                if (callInfo.callStatus === "accepted") {
                    document.getElementById("call-status-text").innerText = "Call Connected";
                    initializeWebRtcConnection(currentRoomId, true);
                } else if (callInfo.callStatus === "rejected" || callInfo.callStatus === "ended") {
                    stopAllActiveHardwareTracks();
                }
            });
        }


        // ==================== 🎛️ INBOUND SIGNAL HANDLING MATRIX (RECEIVER) ====================

        // Global interface listener mapped to core pipeline trigger logic built into Android source native layers hooks
        window.initiateIncomingCallConnection = function(roomId) {
            currentRoomId = roomId;
            document.getElementById("inapp-call-popup").style.display = "none";
            document.getElementById("ringtone-player").pause();
            
            document.getElementById("call-status-text").innerText = "Connecting Call...";
            document.getElementById("video-call-overlay").style.display = "flex";

            database.ref('secure_chats_calls/' + currentRoomId).update({ callStatus: "accepted" });
            initializeWebRtcConnection(currentRoomId, false);
        };

        // Listen for all changes directed towards this profile structure paths
        database.ref('secure_chats_calls').on('child_added', (snapshot) => {
            const callData = snapshot.val();
            if (callData.receiverUid === myUid && callData.callStatus === "pending") {
                currentRoomId = snapshot.key;
                triggerInAppCallRingModal(callData);
            }
        });

        database.ref('secure_chats_calls').on('child_changed', (snapshot) => {
            const callData = snapshot.val();
            if (snapshot.key === currentRoomId && (callData.callStatus === "rejected" || callData.callStatus === "ended")) {
                stopAllActiveHardwareTracks();
            }
        });

        function triggerInAppCallRingModal(callData) {
            document.getElementById("popup-caller-name").innerText = callData.callerName + " Is Calling...";
            document.getElementById("inapp-call-popup").style.display = "flex";
            document.getElementById("ringtone-player").play().catch(()=>{});

            // Bind Actions Controls Hooks
            document.getElementById("popup-ans-btn").onclick = function() {
                window.initiateIncomingCallConnection(callData.roomId);
            };

            document.getElementById("popup-dec-btn").onclick = function() {
                database.ref('secure_chats_calls/' + callData.roomId).update({ callStatus: "rejected" });
                document.getElementById("inapp-call-popup").style.display = "none";
                document.getElementById("ringtone-player").pause();
            };
        }


        // ==================== 🛠️ WebRTC ROUTER CORE SYNC ENGINE (STUN / SDP) ====================

        async function initializeWebRtcConnection(roomId, isCaller) {
            peerConnection = new RTCPeerConnection(rtcIceServers);
            remoteStream = new MediaStream();
            document.getElementById("remote-video").srcObject = remoteStream;

            if (!localStream) {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById("local-video").srcObject = localStream;
            }

            // Push tracks to peer pipeline context mappings loop
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
            };

            // Network ICE candidates sync loops listeners configurations
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    const candidatePath = isCaller ? 'callerCandidates' : 'receiverCandidates';
                    database.ref(`secure_chats_calls/${roomId}/${candidatePath}`).push(event.candidate.toJSON());
                }
            };

            // Negotiation processing models structural routing configurations logic rules
            if (isCaller) {
                const offersdp = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offersdp);
                database.ref(`secure_chats_calls/${roomId}/offer`).set({ type: offersdp.type, sdp: offersdp.sdp });
            } else {
                database.ref(`secure_chats_calls/${roomId}/offer`).once('value', async (snapshot) => {
                    const offer = snapshot.val();
                    if(offer) {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                        const answersdp = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answersdp);
                        database.ref(`secure_chats_calls/${roomId}/answer`).set({ type: answersdp.type, sdp: answersdp.sdp });
                    }
                });
            }

            // Map corresponding channel pathways listeners targets
            if (isCaller) {
                database.ref(`secure_chats_calls/${roomId}/answer`).on('value', async (snapshot) => {
                    const answer = snapshot.val();
                    if (answer && peerConnection.signalingState !== "stable") {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    }
                });
            }

            // Read dynamic incoming ice array structures stream lines maps target endpoints nodes
            const candidatesNodeTarget = isCaller ? 'receiverCandidates' : 'callerCandidates';
            database.ref(`secure_chats_calls/${roomId}/${candidatesNodeTarget}`).on('child_added', (snapshot) => {
                const candidateData = snapshot.val();
                if(candidateData) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(candidateData));
                }
            });
        }

        function hangupCurrentCall() {
            if (currentRoomId) {
                database.ref('secure_chats_calls/' + currentRoomId).update({ callStatus: "ended" });
            }
            stopAllActiveHardwareTracks();
        }

        function stopAllActiveHardwareTracks() {
            document.getElementById("ringtone-player").pause();
            document.getElementById("video-call-overlay").style.display = "none";
            document.getElementById("inapp-call-popup").style.display = "none";
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById("remote-video").srcObject = null;
            document.getElementById("local-video").srcObject = null;
            document.getElementById("call-status-text").innerText = "Call Disconnected";
        }
    </script>
</body>
</html>
