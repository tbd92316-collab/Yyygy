name: Automated HTML to APK Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Pre-Generate Local Android Debug Keystore
      run: |
        mkdir -p github_keystore
        keytool -genkey -v -keystore github_keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup Android Project Files
      run: |
        mkdir -p android/app/src/main/java/com/compiler/htmltoapk
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/assets

        # 1. gradle.properties Setup
        cat << 'EOF' > android/gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 2. AndroidManifest.xml (Permissions for Background, Wakelock, Calls and Boot Control)
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            
            <application 
                android:allowBackup="true" 
                android:label="Fast Chat Pro" 
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                
                <activity android:name="com.compiler.htmltoapk.MainActivity" 
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:launchMode="singleTop"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service 
                    android:name="com.compiler.htmltoapk.RealtimeStreamService"
                    android:foregroundServiceType="dataSync"
                    android:exported="false" />

                <receiver android:name="com.compiler.htmltoapk.WatchdogReceiver" android:exported="false">
                    <intent-filter>
                        <action android:name="android.intent.action.BOOT_COMPLETED" />
                        <action android:name="com.compiler.htmltoapk.RESET_STREAM" />
                    </intent-filter>
                </receiver>
                
                <receiver android:name="com.compiler.htmltoapk.CallActionReceiver" android:exported="false" />
            </application>
        </manifest>
        EOF

        # 3. Activity Layout XML (WebView with Camera/Mic Hardware Integration Support)
        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <android.webkit.WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview" 
            android:layout_width="match_parent" 
            android:layout_height="match_parent" />
        EOF

        # 4. MainActivity.java (WebRTC Permission Engine & Active Target Routing Hub)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/MainActivity.java
        package com.compiler.htmltoapk;
        
        import android.Manifest;
        import android.app.Activity;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.content.pm.PackageManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.webkit.PermissionRequest;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.JavascriptInterface;

        public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> uploadMessage;
            private final static int FILECHOOSER_RESULTCODE = 1;
            public static boolean isAppOpen = false;
            public static String activeChatPartnerUid = "";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                isAppOpen = true;
                
                webView = (WebView) findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                webSettings.setMediaPlaybackRequiresUserGesture(false);
                
                webView.setWebViewClient(new WebViewClient());
                
                webView.setWebChromeClient(new WebChromeClient() {
                    // WebRTC Web Camera and Audio Microphone Permission Capture Rules
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                            request.grant(request.getResources());
                        }
                    }

                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                        if (uploadMessage != null) { uploadMessage.onReceiveValue(null); }
                        uploadMessage = filePathCallback;
                        Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("image/*");
                        startActivityForResult(Intent.createChooser(intent, "Select Image from Gallery"), FILECHOOSER_RESULTCODE);
                        return true;
                    }
                });

                webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                
                // Fast Execution Device Check Boot Request
                requestHardwareExecutionPermissions();
                
                // Handle Pending Deep Link Call Intents
                handleCallIntentRouting(getIntent());
                
                webView.loadUrl("file:///android_asset/index.html");
            }

            private void requestHardwareExecutionPermissions() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                    String[] systemHardwarePermissions = {
                        Manifest.permission.CAMERA,
                        Manifest.permission.RECORD_AUDIO,
                        Manifest.permission.READ_EXTERNAL_STORAGE
                    };
                    if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                        requestPermissions(systemHardwarePermissions, 505);
                    }
                }
            }

            @Override
            protected void onNewIntent(Intent intent) {
                super.onNewIntent(intent);
                setIntent(intent);
                handleCallIntentRouting(intent);
            }

            private void handleCallIntentRouting(Intent intent) {
                if (intent != null && "ACTION_ANSWER_CALL".equals(intent.getAction())) {
                    String triggerRoomId = intent.getStringExtra("room_id");
                    if (triggerRoomId != null && webView != null) {
                        // JavaScript callback initialization to trigger UI redirect to WebRTC Video frame
                        webView.loadUrl("javascript:if(window.initiateIncomingCallConnection){ window.initiateIncomingCallConnection('" + triggerRoomId + "'); }");
                    }
                }
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILECHOOSER_RESULTCODE) {
                    if (uploadMessage == null) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        String dataString = data.getDataString();
                        if (dataString != null) { results = new Uri[]{Uri.parse(dataString)}; }
                    }
                    uploadMessage.onReceiveValue(results);
                    uploadMessage = null;
                }
            }

            @Override
            protected void onResume() { super.onResume(); isAppOpen = true; }
            @Override
            protected void onPause() { super.onPause(); isAppOpen = false; }
            @Override
            protected void onDestroy() { super.onDestroy(); isAppOpen = false; }

            public class WebAppInterface {
                Context mContext;
                WebAppInterface(Context c) { mContext = c; }

                @JavascriptInterface
                public void updateUserSession(String uid, String name) {
                    SharedPreferences prefs = mContext.getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                    prefs.edit().putString("user_uid", uid).putString("user_name", name).apply();
                    
                    // Trigger the 30-Minute Self-Healing Persistent Watchdog Sync Engine
                    Intent serviceIntent = new Intent(mContext, RealtimeStreamService.class);
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        mContext.startForegroundService(serviceIntent);
                    } else {
                        mContext.startService(serviceIntent);
                    }
                    WatchdogReceiver.scheduleNextSystemResetWatchdog(mContext);
                }

                @JavascriptInterface
                public void updateActiveChatPartner(String partnerUid) {
                    MainActivity.activeChatPartnerUid = partnerUid;
                }
            }
        }
        EOF

        # 5. RealtimeStreamService.java Engine (Background Engine with 30-min Auto Refresh, Message Ticks & WebRTC Signaling Call Processor)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/RealtimeStreamService.java
        package com.compiler.htmltoapk;

        import android.app.Notification;
        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.app.PendingIntent;
        import android.app.Service;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.media.AudioAttributes;
        import android.media.RingtoneManager;
        import android.net.Uri;
        import android.os.Build;
        import android.os.IBinder;
        import androidx.core.app.NotificationCompat;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import java.util.HashSet;
        import org.json.JSONObject;

        public class RealtimeStreamService extends Service {
            private static final String CONE_HUB_CHANNEL = "fastchat_core_pipe";
            public static final String CALL_ALERT_CHANNEL = "fastchat_webrtc_call_hub";
            private boolean isListening = false;
            private HashSet<String> capturedKeys = new HashSet<>();
            private HashSet<String> activelyTrackedCalls = new HashSet<>();

            @Override
            public void onCreate() {
                super.onCreate();
                setupSystemChannels();
                Notification serviceRunningBeacon = new NotificationCompat.Builder(this, CONE_HUB_CHANNEL)
                        .setContentTitle("Fast Chat System Sync")
                        .setContentText("Network Pipeline Active (Optimized Engine)")
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setPriority(NotificationCompat.PRIORITY_MIN)
                        .build();
                startForeground(15, serviceRunningBeacon);
            }

            private void setupSystemChannels() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationManager mgr = getSystemService(NotificationManager.class);
                    if (mgr != null) {
                        NotificationChannel coreChan = new NotificationChannel(CONE_HUB_CHANNEL, "Data Pipeline", NotificationManager.IMPORTANCE_MIN);
                        mgr.createNotificationChannel(coreChan);

                        // High Priority Sound Configured Call Channels
                        NotificationChannel callChan = new NotificationChannel(CALL_ALERT_CHANNEL, "Incoming Video Calls", NotificationManager.IMPORTANCE_HIGH);
                        AudioAttributes audioAttributes = new AudioAttributes.Builder()
                                .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                                .build();
                        callChan.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), audioAttributes);
                        callChan.enableVibration(true);
                        mgr.createNotificationChannel(callChan);
                    }
                }
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
                if (!isListening) {
                    isListening = true;
                    launchStreamingListenerSocket();
                }
                return START_STICKY;
            }

            private void launchStreamingListenerSocket() {
                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        boolean ignoreCacheData = true;
                        while (isListening) {
                            try {
                                SharedPreferences prefs = getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                                String myUid = prefs.getString("user_uid", "");

                                if (myUid.isEmpty()) {
                                    Thread.sleep(4000);
                                    continue;
                                }

                                URL url = new URL("https://movi-hub-default-rtdb.firebaseio.com/secure_chats.json");
                                HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                conn.setRequestProperty("Accept", "text/event-stream");
                                conn.setReadTimeout(0);

                                BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                String line;
                                while (isListening && (line = reader.readLine()) != null) {
                                    if (line.startsWith("data:")) {
                                        String rawJson = line.substring(5).trim();
                                        if (rawJson.equals("null") || rawJson.isEmpty()) continue;

                                        JSONObject dataPacket = new JSONObject(rawJson);
                                        if (dataPacket.has("path") && dataPacket.has("data")) {
                                            String path = dataPacket.getString("path");
                                            Object dataObj = dataPacket.get("data");

                                            if (dataObj instanceof JSONObject) {
                                                JSONObject jsonPayload = (JSONObject) dataObj;
                                                if (path.equals("/")) {
                                                    if (ignoreCacheData) {
                                                        ignoreCacheData = false;
                                                        continue;
                                                    }
                                                }
                                                evaluateDataPayload(jsonPayload, myUid);
                                            }
                                        }
                                    }
                                }
                                reader.close();
                            } catch (Exception e) {
                                try { Thread.sleep(3000); } catch (Exception ignored) {}
                            }
                        }
                    }
                }).start();
            }

            private void evaluateDataPayload(JSONObject data, String myUid) {
                try {
                    // 1. WebRTC Structural Call Event Parser
                    if (data.has("callType") && data.has("receiverUid")) {
                        String receiverUid = data.getString("receiverUid");
                        String callStatus = data.optString("callStatus", "pending");
                        String callerName = data.optString("callerName", "Fast Chat User");
                        String roomId = data.optString("roomId", "");
                        String callTimestamp = data.optString("timestamp", "");

                        if (receiverUid.equals(myUid) && callStatus.equals("pending")) {
                            if (!activelyTrackedCalls.contains(callTimestamp)) {
                                activelyTrackedCalls.add(callTimestamp);
                                triggerInAppVideoCallContainer(callerName, roomId);
                            }
                        }
                        return;
                    }

                    // 2. Chat Message Parsing Rules
                    if (data.has("senderUid") && data.has("receiverUid")) {
                        String senderUid = data.getString("senderUid");
                        String receiverUid = data.getString("receiverUid");
                        String senderName = data.getString("senderName");
                        String text = data.optString("text", "");
                        String timestamp = data.optString("timestamp", "");
                        String status = data.optString("status", "sent");

                        String uniqueFingerprint = senderUid + "_" + timestamp;

                        if (!senderUid.equals(myUid) && receiverUid.equals(myUid) && !status.equals("read")) {
                            if (!capturedKeys.contains(uniqueFingerprint)) {
                                capturedKeys.add(uniqueFingerprint);
                                
                                // Double tick and notify only if not actively chatting inside that room
                                if (!MainActivity.isAppOpen || !MainActivity.activeChatPartnerUid.equals(senderUid)) {
                                    triggerInstantPushAlert(senderName, text.isEmpty() ? "🖼️ Shared an Image Gallery item" : text);
                                }
                            }
                        }
                    } else {
                        java.util.Iterator<String> structuralKeys = data.keys();
                        while (structuralKeys.hasNext()) {
                            String nodeKey = structuralKeys.next();
                            Object innerObj = data.get(nodeKey);
                            if (innerObj instanceof JSONObject) {
                                evaluateDataPayload((JSONObject) innerObj, myUid);
                            }
                        }
                    }
                } catch (Exception ignored) {}
            }

            private void triggerInstantPushAlert(String sender, String body) {
                NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (manager == null) return;

                NotificationCompat.Builder alertBuilder = new NotificationCompat.Builder(this, CONE_HUB_CHANNEL)
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setContentTitle(sender)
                        .setContentText(body)
                        .setPriority(NotificationCompat.PRIORITY_HIGH)
                        .setAutoCancel(true);

                manager.notify((int) System.currentTimeMillis(), alertBuilder.build());
            }

            private void triggerInAppVideoCallContainer(String caller, String roomId) {
                NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                if (manager == null) return;

                int callNotificationId = 9912;

                // Answer Target Action Button Redirection Setup
                Intent answerIntent = new Intent(this, MainActivity.class);
                answerIntent.setAction("ACTION_ANSWER_CALL");
                answerIntent.putExtra("room_id", roomId);
                PendingIntent pendingAnswer = PendingIntent.getActivity(this, 1, answerIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE);

                // Decline Target Action Button Setup (Will clear notification and signal decline state directly)
                Intent declineIntent = new Intent(this, CallActionReceiver.class);
                declineIntent.setAction("ACTION_DECLINE_CALL");
                declineIntent.putExtra("room_id", roomId);
                declineIntent.putExtra("notif_id", callNotificationId);
                PendingIntent pendingDecline = PendingIntent.getBroadcast(this, 2, declineIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE);

                NotificationCompat.Builder callLayoutBuilder = new NotificationCompat.Builder(this, CALL_ALERT_CHANNEL)
                        .setSmallIcon(android.R.drawable.sym_action_call)
                        .setContentTitle("Incoming Video Call")
                        .setContentText(caller + " Is Requesting a Video Connection...")
                        .setPriority(NotificationCompat.PRIORITY_MAX)
                        .setCategory(NotificationCompat.CATEGORY_CALL)
                        .setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE))
                        .setOngoing(true)
                        .setAutoCancel(false)
                        .addAction(android.R.drawable.ic_menu_call, "ANSWER", pendingAnswer)
                        .addAction(android.R.drawable.ic_menu_close_clear_cancel, "DECLINE", pendingDecline);

                manager.notify(callNotificationId, callLayoutBuilder.build());
            }

            @Override
            public IBinder onBind(Intent intent) { return null; }

            @Override
            public void onDestroy() {
                isListening = false;
                super.onDestroy();
            }
        }
        EOF

        # 6. WatchdogReceiver.java Engine (Smart 30-Minute Self Healing Pipeline Resetter to Trick Android OS Optimization Core)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/WatchdogReceiver.java
        package com.compiler.htmltoapk;

        import android.app.AlarmManager;
        import android.app.PendingIntent;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.os.Build;
        import android.os.PowerManager;

        public class WatchdogReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context context, Intent intent) {
                PowerManager pm = (PowerManager) context.getSystemService(Context.POWER_SERVICE);
                PowerManager.WakeLock wakeLock = null;
                if (pm != null) {
                    wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "FastChat::WatchdogWakeCore");
                    wakeLock.acquire(5000);
                }

                // Force Restart Foreground Service Pipeline to Bypass OS Kill Time Counters
                Intent serviceIntent = new Intent(context, RealtimeStreamService.class);
                context.stopService(serviceIntent);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    context.startForegroundService(serviceIntent);
                } else {
                    context.startService(serviceIntent);
                }

                if (wakeLock != null && wakeLock.isHeld()) {
                    wakeLock.release();
                }

                // Schedule next automatic 30-minute system reset loop
                scheduleNextSystemResetWatchdog(context);
            }

            public static void scheduleNextSystemResetWatchdog(Context context) {
                AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                Intent intent = new Intent(context, WatchdogReceiver.class);
                intent.setAction("com.compiler.htmltoapk.RESET_STREAM");
                
                PendingIntent pi = PendingIntent.getBroadcast(context, 404, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE);
                if (am != null) {
                    long resetTriggerDurationWindow = System.currentTimeMillis() + (30 * 60 * 1000); // Perfect 30 Minute Mapping Execution Loop
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                        am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, resetTriggerDurationWindow, pi);
                    } else {
                        am.setExact(AlarmManager.RTC_WAKEUP, resetTriggerDurationWindow, pi);
                    }
                }
            }
        }
        EOF

        # 7. CallActionReceiver.java Engine (Handles Immediate Decline In Notification Window Context)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/CallActionReceiver.java
        package com.compiler.htmltoapk;

        import android.app.NotificationManager;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import java.net.HttpURLConnection;
        import java.net.URL;

        public class CallActionReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(final Context context, Intent intent) {
                if ("ACTION_DECLINE_CALL".equals(intent.getAction())) {
                    final String roomId = intent.getStringExtra("room_id");
                    int notifId = intent.getIntExtra("notif_id", 9912);

                    // Drop Notification Bar Stack Immediately
                    NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                    if (manager != null) { manager.cancel(notifId); }

                    // Send asynchronous web request payload to write 'rejected' event directly to Firebase WebRTC node
                    if (roomId != null) {
                        new Thread(new Runnable() {
                            @Override
                            public void run() {
                                try {
                                    URL url = new URL("https://movi-hub-default-rtdb.firebaseio.com/secure_chats_calls/" + roomId + "/callStatus.json");
                                    HttpURLConnection connection = (HttpURLConnection) url.openConnection();
                                    connection.setRequestMethod("PUT");
                                    connection.setDoOutput(true);
                                    connection.getOutputStream().write("\"rejected\"".getBytes("UTF-8"));
                                    connection.getInputStream().close();
                                } catch (Exception ignored) {}
                            }
                        }).start();
                    }
                }
            }
        }
        EOF

        # 8. Root build.gradle Setup
        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 9. Settings.gradle Setup
        cat << 'EOF' > android/settings.gradle
        include ':app'
        EOF

        # 10. App-level build.gradle Setup
        cat << 'EOF' > android/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace "com.compiler.htmltoapk"
            compileSdk 34
            defaultConfig {
                applicationId "com.compiler.htmltoapk"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "3.5"
                ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
            }
            signingConfigs {
                debug {
                    storeFile file("../../github_keystore/debug.keystore")
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
            buildTypes {
                debug {
                    signingConfig signingConfigs.debug
                }
            }
        }
        dependencies { implementation 'androidx.core:core:1.12.0' }
        EOF

    - name: Inject Custom Assets and Logo Resources
      run: |
        if [ -f "logo.png" ]; then
          cp logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        else
          cp android/app/src/main/java/com/compiler/htmltoapk/MainActivity.java android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        fi

        if [ -f "index.html" ]; then
          cp index.html android/app/src/main/assets/index.html
        else
          echo "<h1>Fast Chat Setup Error</h1>" > android/app/src/main/assets/index.html
        fi

    - name: Build Android Project wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    - name: Compile and Generate APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fast-Chat-Ultimate-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
