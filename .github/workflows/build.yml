name: Automated HTML to APK Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-Generate Local Android Debug Keystore
        run: |
          mkdir -p github_keystore
          keytool -genkey -v -keystore github_keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Android Project Files
        run: |
          mkdir -p android/app/src/main/java/com/compiler/htmltoapk
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/assets

          # 1. gradle.properties Setup
          cat << 'EOF' > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. AndroidManifest.xml (Strict Permission Updates)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              
              <application 
                  android:allowBackup="true" 
                  android:label="Fast Chat Pro" 
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  
                  <activity android:name="com.compiler.htmltoapk.MainActivity" 
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service 
                      android:name="com.compiler.htmltoapk.RealtimeStreamService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <receiver android:name="com.compiler.htmltoapk.Restarter" android:exported="false">
                      <intent-filter>
                          <action android:name="com.compiler.htmltoapk.RESET_SIGNAL_PIPE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 3. Activity Layout XML
          cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
          <android.webkit.WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview" 
              android:layout_width="match_parent" 
              android:layout_height="match_parent" />
          EOF

          # 4. MainActivity.java (Isolated Core Layer)
          cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/MainActivity.java
          package com.compiler.htmltoapk;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              public static boolean isAppOpen = false;
              public static String activeChatPartnerUid = "";
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  webView = (WebView) findViewById(R.id.webview);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) { uploadMessage.onReceiveValue(null); }
                          uploadMessage = filePathCallback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          startActivityForResult(Intent.createChooser(intent, "Select Image from Gallery"), FILECHOOSER_RESULTCODE);
                          return true;
                      }
                  });

                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                  
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                  }
                  
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (uploadMessage == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          String dataString = data.getDataString();
                          if (dataString != null) { results = new Uri[]{Uri.parse(dataString)}; }
                      }
                      uploadMessage.onReceiveValue(results);
                      uploadMessage = null;
                  }
              }

              @Override
              protected void onResume() { super.onResume(); isAppOpen = true; }
              @Override
              protected void onPause() { super.onPause(); isAppOpen = false; }
              @Override
              protected void onDestroy() { super.onDestroy(); isAppOpen = false; }

              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }

                  @JavascriptInterface
                  public void updateUserSession(final String uid, final String name) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if(mContext == null) return;
                              SharedPreferences prefs = mContext.getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                              prefs.edit().putString("user_uid", uid).putString("user_name", name).apply();
                              
                              try {
                                  Intent serviceIntent = new Intent(mContext, RealtimeStreamService.class);
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      mContext.startForegroundService(serviceIntent);
                                  } else {
                                      mContext.startService(serviceIntent);
                                  }
                              } catch (Exception e) {
                                  e.printStackTrace();
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void updateActiveChatPartner(String partnerUid) {
                      MainActivity.activeChatPartnerUid = partnerUid;
                  }
              }
          }
          EOF

          # 5. RealtimeStreamService.java Engine (100% CRASH-PROOFED & STREAMLINED)
          cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/RealtimeStreamService.java
          package com.compiler.htmltoapk;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.SystemClock;
          import androidx.core.app.NotificationCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.HashSet;
          import org.json.JSONObject;

          public class RealtimeStreamService extends Service {
              private static final String ENGINE_CHANNEL = "fastchat_engine_hub";
              private static final String ALERT_CHANNEL = "fast_chat_secure_ultimate";
              private boolean isListening = false;
              private HashSet<String> deliveredKeys = new HashSet<>();
              private Thread streamThread = null;

              @Override
              public void onCreate() {
                  super.onCreate();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  // Instant notification channel attachment to prevent OS enforcement exit crash
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel chan = new NotificationChannel(ENGINE_CHANNEL, "Background Pipeline", NotificationManager.IMPORTANCE_MIN);
                      NotificationChannel alertChan = new NotificationChannel(ALERT_CHANNEL, "Message High Speed Alerts", NotificationManager.IMPORTANCE_HIGH);
                      NotificationManager mgr = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (mgr != null) {
                          mgr.createNotificationChannel(chan);
                          mgr.createNotificationChannel(alertChan);
                      }
                  }
                  
                  Notification standardNotification = new NotificationCompat.Builder(this, ENGINE_CHANNEL)
                          .setContentTitle("Fast Chat Core System")
                          .setContentText("Background Engine Online")
                          .setSmallIcon(android.R.drawable.stat_notify_chat)
                          .setPriority(NotificationCompat.PRIORITY_MIN)
                          .build();
                  
                  startForeground(2, standardNotification);

                  if (!isListening) {
                      isListening = true;
                      scheduleNextSystemFlush(this);
                      openStreamingSocket();
                  }
                  
                  return START_STICKY;
              }

              private void scheduleNextSystemFlush(Context context) {
                  Intent resetIntent = new Intent(context, Restarter.class);
                  resetIntent.setAction("com.compiler.htmltoapk.RESET_SIGNAL_PIPE");
                  
                  int pendingFlags = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      pendingFlags |= PendingIntent.FLAG_IMMUTABLE;
                  }
                  
                  PendingIntent pi = PendingIntent.getBroadcast(context, 0, resetIntent, pendingFlags);
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  
                  if (am != null) {
                      long triggerTimeMs = SystemClock.elapsedRealtime() + (30 * 60 * 1000);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerTimeMs, pi);
                      } else {
                          am.setExact(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerTimeMs, pi);
                      }
                  }
              }

              private void openStreamingSocket() {
                  if (streamThread != null && streamThread.isAlive()) return;

                  streamThread = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          boolean graceBootMode = true;
                          SharedPreferences prefs = getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                          
                          while (isListening) {
                              HttpURLConnection conn = null;
                              BufferedReader reader = null;
                              try {
                                  String myUid = prefs.getString("user_uid", "");
                                  if (myUid.isEmpty()) {
                                      Thread.sleep(3000);
                                      continue;
                                  }

                                  URL url = new URL("https://movi-hub-default-rtdb.firebaseio.com/secure_chats.json");
                                  conn = (HttpURLConnection) url.openConnection();
                                  conn.setRequestProperty("Accept", "text/event-stream");
                                  conn.setReadTimeout(0);
                                  conn.setConnectTimeout(15000);

                                  reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                  String line;
                                  while (isListening && (line = reader.readLine()) != null) {
                                      if (line.startsWith("data:")) {
                                          String rawJson = line.substring(5).trim();
                                          if (rawJson.equals("null") || rawJson.isEmpty()) continue;

                                          JSONObject streamPacket = new JSONObject(rawJson);
                                          if (streamPacket.has("path") && streamPacket.has("data")) {
                                              String path = streamPacket.getString("path");
                                              Object dataObj = streamPacket.get("data");

                                              if (dataObj instanceof JSONObject) {
                                                  JSONObject dataJson = (JSONObject) dataObj;

                                                  if (path.equals("/")) {
                                                      if (graceBootMode) {
                                                          graceBootMode = false;
                                                          continue;
                                                      }
                                                  } else if (path.contains(myUid)) {
                                                      parseMessagePayloadAndAlert(dataJson, myUid);
                                                  }
                                              }
                                          }
                                      }
                                  }
                              } catch (Exception e) {
                                  e.printStackTrace();
                              } finally {
                                  try { if (reader != null) reader.close(); } catch(Exception ignored){}
                                  try { if (conn != null) conn.disconnect(); } catch(Exception ignored){}
                              }
                              
                              try { Thread.sleep(4000); } catch (Exception ignored) {}
                          }
                      }
                  });
                  streamThread.start();
              }

              private void parseMessagePayloadAndAlert(JSONObject data, String myUid) {
                  try {
                      if (data.has("senderUid") && data.has("receiverUid")) {
                          String senderUid = data.getString("senderUid");
                          String receiverUid = data.getString("receiverUid");
                          String senderName = data.getString("senderName");
                          String text = data.optString("text", "");
                          String timestamp = data.optString("timestamp", "");
                          String status = data.optString("status", "sent");

                          String messageUniqueFingerprint = senderUid + "_" + timestamp;

                          if (!senderUid.equals(myUid) && receiverUid.equals(myUid) && !status.equals("read")) {
                              if (!deliveredKeys.contains(messageUniqueFingerprint)) {
                                  deliveredKeys.add(messageUniqueFingerprint);

                                  if (!MainActivity.isAppOpen || !MainActivity.activeChatPartnerUid.equals(senderUid)) {
                                      triggerInstantPushAlert(senderName, text.isEmpty() ? "🖼️ Shared an Image" : text);
                                  }
                              }
                          }
                      } else {
                          java.util.Iterator<String> structuralKeys = data.keys();
                          while (structuralKeys.hasNext()) {
                              String uniqueNodeKey = structuralKeys.next();
                              Object innerObj = data.get(uniqueNodeKey);
                              if (innerObj instanceof JSONObject) {
                                  parseMessagePayloadAndAlert((JSONObject) innerObj, myUid);
                              }
                          }
   
