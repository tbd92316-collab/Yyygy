name: Automated HTML to APK Compiler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android Project Files
      run: |
        mkdir -p android/app/src/main/java/com/compiler/htmltoapk
        mkdir -p android/app/src/main/res/layout
        mkdir -p android/app/src/main/res/values
        mkdir -p android/app/src/main/res/mipmap-mdpi
        mkdir -p android/app/src/main/assets

        # 1. gradle.properties
        cat << 'EOF' > android/gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 2. AndroidManifest.xml (Battery Optimized Optimization API nodes)
        cat << 'EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            
            <application 
                android:allowBackup="true" 
                android:label="Fast Chat Pro" 
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                
                <activity android:name="com.compiler.htmltoapk.MainActivity" 
                    android:configChanges="orientation|screenSize"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <receiver android:name="com.compiler.htmltoapk.BackgroundSyncReceiver" android:exported="false" />
            </application>
        </manifest>
        EOF

        # 3. Activity Layout XML
        cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
        <android.webkit.WebView xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/webview" 
            android:layout_width="match_parent" 
            android:layout_height="match_parent" />
        EOF

        # 4. MainActivity.java (Handles Storage Inputs & OS Optimization Engine)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/MainActivity.java
        package com.compiler.htmltoapk;
        
        import android.Manifest;
        import android.app.Activity;
        import android.app.AlarmManager;
        import android.app.PendingIntent;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.net.Uri;
        import android.os.Build;
        import android.os.Bundle;
        import android.webkit.ValueCallback;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.webkit.JavascriptInterface;
        import androidx.core.app.ActivityCompat;

        public class MainActivity extends Activity {
            private WebView webView;
            public static boolean isAppOpen = false;
            public static String activeChatPartnerUid = "";
            private ValueCallback<Uri[]> uploadMessage;
            private final static int FILECHOOSER_RESULTCODE = 1;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                webView = (WebView) findViewById(R.id.webview);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setDatabaseEnabled(true);
                webSettings.setAllowFileAccess(true);
                webSettings.setAllowContentAccess(true);
                
                webView.setWebViewClient(new WebViewClient());
                
                // ChromeClient for direct Gallery storage selector intent hooks
                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                        if (uploadMessage != null) { uploadMessage.onReceiveValue(null); }
                        uploadMessage = filePathCallback;
                        Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                        intent.addCategory(Intent.CATEGORY_OPENABLE);
                        intent.setType("image/*");
                        startActivityForResult(Intent.createChooser(intent, "Select Image from Gallery"), FILECHOOSER_RESULTCODE);
                        return true;
                    }
                });

                webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                }
                
                webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                if (requestCode == FILECHOOSER_RESULTCODE) {
                    if (uploadMessage == null) return;
                    Uri[] results = null;
                    if (resultCode == Activity.RESULT_OK && data != null) {
                        String dataString = data.getDataString();
                        if (dataString != null) { results = new Uri[]{Uri.parse(dataString)}; }
                    }
                    uploadMessage.onReceiveValue(results);
                    uploadMessage = null;
                }
            }

            @Override
            protected void onResume() { super.onResume(); isAppOpen = true; }
            @Override
            protected void onPause() { super.onPause(); isAppOpen = false; }
            @Override
            protected void onDestroy() { super.onDestroy(); isAppOpen = false; }

            public class WebAppInterface {
                Context mContext;
                WebAppInterface(Context c) { mContext = c; }

                @JavascriptInterface
                public void updateUserSession(String uid, String name) {
                    SharedPreferences prefs = mContext.getSharedPreferences("FastChatPrefs", MODE_PRIVATE);
                    prefs.edit().putString("user_uid", uid).putString("user_name", name).apply();
                    
                    // Native Lightweight OS Scheduler setup instead of heavy battery killing threads
                    AlarmManager alarmManager = (AlarmManager) mContext.getSystemService(Context.ALARM_SERVICE);
                    Intent intent = new Intent(mContext, BackgroundSyncReceiver.class);
                    PendingIntent pendingIntent = PendingIntent.getBroadcast(mContext, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                    
                    if (alarmManager != null) {
                        alarmManager.setRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis(), 8000, pendingIntent);
                    }
                }

                @JavascriptInterface
                public void updateActiveChatPartner(String partnerUid) {
                    MainActivity.activeChatPartnerUid = partnerUid;
                }
            }

            @Override
            public void onBackPressed() {
                if (webView != null && webView.canGoBack()) { webView.goBack(); } else { super.onBackPressed(); }
            }
        }
        EOF

        # 5. BackgroundSyncReceiver.java (Optimized REST Parser Engine - NO KILL WARNING)
        cat << 'EOF' > android/app/src/main/java/com/compiler/htmltoapk/BackgroundSyncReceiver.java
        package com.compiler.htmltoapk;

        import android.app.NotificationChannel;
        import android.app.NotificationManager;
        import android.content.BroadcastReceiver;
        import android.content.Context;
        import android.content.Intent;
        import android.content.SharedPreferences;
        import android.media.RingtoneManager;
        import android.os.Build;
        import androidx.core.app.NotificationCompat;
        import java.io.BufferedReader;
        import java.io.InputStreamReader;
        import java.net.HttpURLConnection;
        import java.net.URL;
        import org.json.JSONObject;
        import java.util.Iterator;

        public class BackgroundSyncReceiver extends BroadcastReceiver {
            private static final String ALERT_CHANNEL_ID = "fast_chat_secure_ultimate";

            @Override
            public void onReceive(final Context context, Intent intent) {
                if (MainActivity.isAppOpen) return; // Skip if app is currently visible

                new Thread(new Runnable() {
                    @Override
                    public void run() {
                        try {
                            SharedPreferences prefs = context.getSharedPreferences("FastChatPrefs", Context.MODE_PRIVATE);
                            String myUid = prefs.getString("user_uid", "");
                            String lastSeenMsgId = prefs.getString("last_seen_msg_id", "");

                            if (!myUid.isEmpty()) {
                                URL url = new URL("https://movi-hub-default-rtdb.firebaseio.com/secure_chats.json");
                                HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                                conn.setRequestMethod("GET");
                                conn.setConnectTimeout(3000);
                                conn.setReadTimeout(3000);
                                
                                BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                                StringBuilder response = new StringBuilder();
                                String inputLine;
                                while ((inputLine = in.readLine()) != null) { response.append(inputLine); }
                                in.close();

                                if (response.toString().equals("null")) return;

                                JSONObject allRooms = new JSONObject(response.toString());
                                Iterator<String> keys = allRooms.keys();
                                
                                while (keys.hasNext()) {
                                    String roomId = keys.next();
                                    if (roomId.contains(myUid)) {
                                        JSONObject roomMessages = allRooms.getJSONObject(roomId);
                                        Iterator<String> msgKeys = roomMessages.keys();
                                        String lastMsgId = "";
                                        while(msgKeys.hasNext()) { lastMsgId = msgKeys.next(); }
                                        
                                        if (!lastMsgId.isEmpty() && !lastMsgId.equals(lastSeenMsgId)) {
                                            JSONObject messageData = roomMessages.getJSONObject(lastMsgId);
                                            String senderUid = messageData.getString("senderUid");
                                            String receiverUid = messageData.getString("receiverUid");
                                            String senderName = messageData.getString("senderName");
                                            String text = messageData.optString("text", "");
                                            String status = messageData.optString("status", "sent");

                                            if (!senderUid.equals(myUid) && receiverUid.equals(myUid) && !status.equals("read")) {
                                                prefs.edit().putString("last_seen_msg_id", lastMsgId).apply();
                                                triggerSystemAlert(context, senderName, text.isEmpty() ? "🖼️ Shared an Image Gallery item" : text);
                                            }
                                        }
                                    }
                                }
                            }
                        } catch (Exception e) { e.printStackTrace(); }
                    }
                }).start();
            }

            private void triggerSystemAlert(Context ctx, String title, String body) {
                NotificationManager manager = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                if (manager == null) return;

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    NotificationChannel alertChannel = new NotificationChannel(ALERT_CHANNEL_ID, "Chat High Alerts", NotificationManager.IMPORTANCE_HIGH);
                    alertChannel.enableLights(true);
                    alertChannel.enableVibration(true);
                    manager.createNotificationChannel(alertChannel);
                }

                NotificationCompat.Builder builder = new NotificationCompat.Builder(ctx, ALERT_CHANNEL_ID)
                        .setSmallIcon(android.R.drawable.stat_notify_chat)
                        .setContentTitle(title)
                        .setContentText(body)
                        .setPriority(NotificationCompat.PRIORITY_HIGH)
                        .setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)) // Native Custom Audio Alert Sound hook
                        .setDefaults(NotificationCompat.DEFAULT_ALL)
                        .setAutoCancel(true);

                manager.notify((int) System.currentTimeMillis(), builder.build());
            }
        }
        EOF

        # 6. Root build.gradle Setup
        cat << 'EOF' > android/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 7. Settings.gradle Setup
        cat << 'EOF' > android/settings.gradle
        include ':app'
        EOF

        # 8. App-level build.gradle Setup
        cat << 'EOF' > android/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.compiler.htmltoapk'
            compileSdk 34
            defaultConfig {
                applicationId "com.compiler.htmltoapk"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "2.0"
                ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
            }
        }
        dependencies { implementation 'androidx.core:core:1.12.0' }
        EOF

    - name: Inject Custom App Logo
      run: |
        if [ -f "logo.png" ]; then
          cp logo.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        else
          touch android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        fi

    - name: Inject HTML into App Assets
      run: |
        if [ -f "index.html" ]; then
          cp index.html android/app/src/main/assets/index.html
        else
          echo "<h1>Error</h1>" > android/app/src/main/assets/index.html
        fi

    - name: Build Android Project wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    - name: Compile and Generate APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload Generated APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fast-Chat-Ultimate-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
