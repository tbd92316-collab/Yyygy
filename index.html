<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Hybrid WebApp</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h2 { color: #38bdf8; margin-top: 0; }
        p { color: #94a3b8; font-size: 14px; }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:active { background: #1d4ed8; }
        .btn-notify { background: #22c55e; }
        .btn-notify:active { background: #16a34a; }
    </style>
</head>
<body>

    <div class="container">
        <h2>System Livie! ✅</h2>
        <p>Permissions, Camera, Mic, GPS aur Notification test karne ke liye niche click karein.</p>
        
        <button class="btn btn-notify" onclick="sendTestNotification()">Notification Bhejo</button>
        
        <button class="btn" onclick="alert('JS Interface Working!')">Alert Test</button>
    </div>

    <script>
        function sendTestNotification() {
            // Yeh check karta hai ki kya app Android ke andar chal rahi hai aur bridge connected hai
            if (window.AndroidBridge && typeof window.AndroidBridge.showNotification === 'function') {
                
                // Native Java function ko call kiya title aur message ke sath
                window.AndroidBridge.showNotification("Fast Chat Test", "Bhai, HTML se notification chal gaya! 🔥");
                
            } else {
                // Agar normal browser me khologe toh alert dikhega
                alert("Notification simulation: Android device par hi real notification dikhega!");
            }
        }
    </script>

</body>
</html>
